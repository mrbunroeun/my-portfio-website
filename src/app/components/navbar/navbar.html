<nav
  class="bg-[#090d16]/80 backdrop-blur-xl border-b border-white/[0.08] fixed top-0 left-0 right-0 z-50 transition-all duration-300 shadow-lg shadow-black/20"
  [class.-translate-y-full]="isHidden()"
>
  <div class="max-w-7xl mx-auto flex items-center justify-between px-6 sm:px-10 py-3.5">
    <!-- Brand Logo -->
    <a href="#hero" class="flex items-center gap-2.5 group no-underline">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-violet-500 flex items-center justify-center font-bold text-white shadow-md shadow-blue-500/20 group-hover:scale-105 transition-transform duration-200">
        <span>BR</span>
      </div>
      <div class="flex flex-col">
        <span class="text-white font-bold text-lg tracking-tight group-hover:text-blue-400 transition-colors">Bunroeun</span>
        <span class="text-slate-400 text-xs font-medium -mt-1 tracking-wider uppercase">Portfolio</span>
      </div>
    </a>

    <!-- Desktop nav -->
    <div class="hidden min-[768px]:flex items-center gap-8">
      <ul class="flex items-center gap-1 list-none m-0 p-0">
        <li>
          <a href="#hero" class="text-slate-300 hover:text-white px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-white/[0.06] transition-all no-underline">
            Home
          </a>
        </li>
        <li>
          <a href="#about" class="text-slate-300 hover:text-white px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-white/[0.06] transition-all no-underline">
            About
          </a>
        </li>
        <li>
          <a href="#skills" class="text-slate-300 hover:text-white px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-white/[0.06] transition-all no-underline">
            Skills
          </a>
        </li>
        <li>
          <a href="#projects" class="text-slate-300 hover:text-white px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-white/[0.06] transition-all no-underline">
            Projects
          </a>
        </li>
        <li>
          <a href="#designs" class="text-slate-300 hover:text-white px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-white/[0.06] transition-all no-underline">
            Designs
          </a>
        </li>
        <li>
          <a href="#contact" class="text-slate-300 hover:text-white px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-white/[0.06] transition-all no-underline">
            Contact
          </a>
        </li>
      </ul>

      <a
        href="mailto:bunroeunhas@gmail.com"
        class="inline-flex items-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-sm font-semibold px-4 py-2 rounded-xl shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:-translate-y-0.5 transition-all duration-200 no-underline cursor-pointer"
      >
        <span>Hire Me</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </a>
    </div>

    <!-- Hamburger button -->
    <button
      class="min-[768px]:hidden flex flex-col justify-center items-center w-10 h-10 rounded-xl bg-white/[0.05] border border-white/10 text-slate-300 hover:text-white cursor-pointer transition-colors"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
    >
      <div class="flex flex-col gap-1.5 w-5">
        <span class="w-full h-0.5 bg-current rounded-full transition-all"></span>
        <span class="w-full h-0.5 bg-current rounded-full transition-all"></span>
        <span class="w-full h-0.5 bg-current rounded-full transition-all"></span>
      </div>
    </button>
  </div>

  <!-- Mobile menu dropdown -->
  @if (isMenuOpen()) {
    <div class="min-[768px]:hidden flex flex-col gap-3 px-6 py-5 bg-[#0b0f1a] border-t border-white/10 shadow-2xl backdrop-blur-xl">
      <a href="#hero" (click)="toggleMenu()" class="text-slate-200 hover:text-white px-3 py-2 rounded-lg text-base font-medium hover:bg-white/[0.06] transition-all no-underline">Home</a>
      <a href="#about" (click)="toggleMenu()" class="text-slate-200 hover:text-white px-3 py-2 rounded-lg text-base font-medium hover:bg-white/[0.06] transition-all no-underline">About</a>
      <a href="#skills" (click)="toggleMenu()" class="text-slate-200 hover:text-white px-3 py-2 rounded-lg text-base font-medium hover:bg-white/[0.06] transition-all no-underline">Skills</a>
      <a href="#projects" (click)="toggleMenu()" class="text-slate-200 hover:text-white px-3 py-2 rounded-lg text-base font-medium hover:bg-white/[0.06] transition-all no-underline">Projects</a>
      <a href="#designs" (click)="toggleMenu()" class="text-slate-200 hover:text-white px-3 py-2 rounded-lg text-base font-medium hover:bg-white/[0.06] transition-all no-underline">Designs</a>
      <a href="#contact" (click)="toggleMenu()" class="text-slate-200 hover:text-white px-3 py-2 rounded-lg text-base font-medium hover:bg-white/[0.06] transition-all no-underline">Contact</a>
      <a
        href="mailto:bunroeunhas@gmail.com"
        class="inline-flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold px-4 py-2.5 rounded-xl shadow-lg shadow-blue-500/25 mt-2 no-underline text-center"
      >
        <span>Hire Me</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </a>
    </div>
  }
</nav>
